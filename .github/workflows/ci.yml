# CI: runs on every PR and on pushes to dev / main.
name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  # prisma.config.ts requires a URL even for `prisma generate`, which never connects.
  # Jobs that use a real database override it (e2e tests read TEST_DATABASE_URL).
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - name: Lint (incl. formatting)
        run: npm run lint:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:cov
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit
          retention-days: 7

  e2e:
    name: End-to-end tests (Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: checks
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fada_test
          POSTGRES_PASSWORD: fada_test
          POSTGRES_DB: fada_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fada_test -d fada_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://fada_test:fada_test@localhost:5432/fada_test?schema=public
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - name: Migration drift check (migrations must reproduce schema.prisma exactly)
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          npx prisma migrate deploy
          DRIFT="$(npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --script | grep -vE '^\s*$|^--' || true)"
          if [ -n "$DRIFT" ]; then echo "::error::Schema drift detected"; echo "$DRIFT"; exit 1; fi
      - name: End-to-end tests
        run: npm run test:e2e:cov
      - uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit
      - name: Business-logic coverage gate
        env:
          BUSINESS_COVERAGE_MIN: '70'
        run: npm run coverage:merge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-merged
          path: coverage/merged
          retention-days: 14

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fada-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
